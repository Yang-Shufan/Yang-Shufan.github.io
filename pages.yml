# Pages CMS hosted editor: https://app.pagescms.org/
# Website data are ordinary JSON files. The public homepage reads them without a server.
media:
  - name: article_pdfs
    label: Article PDFs
    input: assets/articles
    output: /assets/articles
    extensions: [pdf]
    rename: safe
  - name: cv_files
    label: CV files
    input: assets
    output: /assets
    extensions: [pdf]
    rename: safe
  - name: portraits
    label: Profile photos
    input: assets
    output: /assets
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: hero_backgrounds
    label: Homepage hero / 首页横幅背景图
    input: assets/hero
    output: /assets/hero
    extensions: [jpg, jpeg, png, webp]
    rename: safe
content:
  - name: profile
    label: Homepage, About & CV
    type: file
    path: data/profile.json
    format: json
    fields:
      - { name: chinese_name, label: 中文姓名, type: string, required: true }
      - { name: english_name, label: English name, type: string, required: true }
      - { name: hero_name, label: Hero eyebrow / 标题上方姓名, type: string }
      - { name: role, label: Position, type: string }
      - { name: school, label: School, type: string }
      - { name: university, label: University, type: string }
      - { name: email, label: Email shown as plain text, type: string }
      - { name: hero_line_one, label: Research title — first line, type: string }
      - { name: hero_line_two, label: Research title — second line, type: string }
      - { name: hero_subtitle, label: Research subtitle, type: string }
      - name: section_titles
        label: Section headings (edit website titles)
        type: object
        fields:
          - { name: about, label: About section heading, type: string }
          - { name: education, label: Education section heading, type: string }
          - { name: publications, label: Publications section heading, type: string }
          - { name: working_papers, label: Working Papers section heading, type: string }
          - { name: talks, label: Conferences section heading, type: string }
          - { name: activities, label: Activities section heading, type: string }
      - { name: cv_button_text, label: CV button text, type: string }
      - name: research_tags
        label: Research keywords (add or reorder)
        type: string
        list: true
      - name: about_paragraphs
        label: About Me — paragraphs
        type: text
        list: true
        description: 'Supports **bold** and [label](https://...) only. One item is one paragraph.'
      - name: portrait
        label: Profile photo
        type: image
        options: { media: portraits }
      - name: hero_background
        label: 首页横幅背景图 / Hero background image
        type: image
        options: { media: hero_backgrounds }
        description: "上传图片并保存即可更换主页顶部背景；原有暖色渐变蒙层会自动保留。建议上传横幅可裁切的大尺寸照片。"
      - name: cv
        label: CV PDF — replace using upload
        type: file
        options: { media: cv_files, extensions: [pdf] }
      - { name: footer_note, label: Footer note, type: string }
  - name: publications
    label: Publications — paste APA
    type: file
    path: data/publications.json
    format: json
    list: true
    fields:
      - name: apa
        label: APA reference (paste whole citation)
        type: text
        required: true
        description: 'The website extracts author(s), year, original title, journal, volume/issue and pages automatically. Save, then refresh your site to see the formatted result.'
      - name: language
        label: Original publication language (optional; auto-detected when blank)
        type: select
        options:
          values:
            - { name: zh, label: Chinese }
            - { name: en, label: English }
      - name: order
        label: Display order (1 appears first)
        type: number
      - name: authors_display
        label: Verified English author names (optional)
        type: string
        description: 'Optional. Separate full names with semicolons, e.g. Shufan Yang; Lingyi Zhou. Never automatically translates Chinese names.'
      - name: corresponding_author
        label: Corresponding author (exact displayed full name)
        type: string
        description: 'Optional. Automatically adds * after the matching name.'
      - name: english_title
        label: Official English article title (Chinese papers only)
        type: text
        description: 'Optional; enter the official or your approved English title yourself. The system NEVER generates an English translation.'
      - name: english_journal
        label: Official English journal name (Chinese papers only)
        type: string
        description: 'Optional; supply the established official English name. NEVER generated by the parser.'
      - name: title_original
        label: Original title override (only if APA parsing needs correction)
        type: text
      - name: journal_original
        label: Journal override (only if APA parsing needs correction)
        type: string
      - name: year_override
        label: Year override (only if APA parsing needs correction)
        type: string
      - name: article_pdf
        label: Read article — upload PDF
        type: file
        options: { media: article_pdfs, extensions: [pdf] }
      - name: article_url
        label: Read article — external URL (if no PDF)
        type: string
        description: 'PDF takes priority. Leave both URL and PDF blank to hide Read article.'
      - { name: visible, label: Show on website, type: boolean, default: true }
  - name: workingpapers
    label: Working Papers — paste APA
    type: file
    path: data/working-papers.json
    format: json
    list: true
    fields:
      - name: apa
        label: APA reference (paste whole citation)
        type: text
        required: true
      - name: language
        label: Language
        type: select
        options:
          values:
            - { name: zh, label: Chinese }
            - { name: en, label: English }
      - { name: order, label: Display order, type: number }
      - name: authors_display
        label: Verified full author names — semicolon separated
        type: string
      - name: english_title
        label: English title — manual only for Chinese papers
        type: text
      - name: title_original
        label: Original title override (if necessary)
        type: text
      - name: corresponding_author
        label: Corresponding author (optional)
        type: string
      - name: article_pdf
        label: Upload PDF (optional)
        type: file
        options: { media: article_pdfs, extensions: [pdf] }
      - { name: article_url, label: External paper link (optional), type: string }
      - { name: visible, label: Show on website, type: boolean, default: true }
  - name: education
    label: Education
    type: file
    path: data/education.json
    format: json
    list: true
    fields:
      - { name: period, label: Dates, type: string }
      - { name: university, label: University, type: string }
      - { name: degree, label: Degree / program, type: string }
      - { name: school, label: School / department, type: string }
      - { name: city, label: City, type: string }
      - { name: country, label: Country, type: string }
      - { name: url, label: University website, type: string }
      - { name: abbreviation, label: Short initials, type: string }
      - { name: order, label: Display order, type: number }
      - { name: visible, label: Show on website, type: boolean, default: true }
  - name: conferences
    label: Conferences & Invited Talks
    type: file
    path: data/conferences.json
    format: json
    list: true
    fields:
      - { name: year, label: Year, type: string }
      - name: language
        label: Original conference language
        type: select
        options:
          values:
            - { name: zh, label: Chinese (original first) }
            - { name: en, label: English only }
      - { name: name_original, label: Conference name (no university appended), type: string }
      - name: name_english
        label: Official / approved English translation for Chinese conference
        type: string
        description: 'Never translated automatically; leave blank for an English-language event.'
      - { name: host_institution, label: Host institution (optional), type: string }
      - { name: city, label: City, type: string }
      - { name: country, label: Country, type: string }
      - { name: order, label: Display order, type: number }
      - { name: visible, label: Show on website, type: boolean, default: true }
  - name: activities
    label: Professional Activities
    type: file
    path: data/activities.json
    format: json
    list: true
    fields:
      - { name: role, label: Role, type: string }
      - { name: organization, label: Organization, type: string }
      - { name: role_original, label: Chinese role name, type: string }
      - { name: organization_original, label: Chinese organization name, type: string }
      - { name: period, label: Period, type: string }
      - { name: order, label: Display order, type: number }
      - { name: visible, label: Show on website, type: boolean, default: true }
